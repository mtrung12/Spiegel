name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      # The graph-store integration tests skip themselves without this, and they
      # are the only ones that exercise a real database - pagination cursors,
      # empty-result handling and undirected edge reads all behave differently
      # against a stub. No LLM or embedding server is needed: they write nodes
      # directly.
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11
        working-directory: backend

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # Config.validate() runs at import in wsgi.py, and several tests build the
      # app via create_app(). Supply placeholder credentials so collection does
      # not depend on a real .env: the suite stubs out every outbound call.
      - name: Run tests
        run: uv run python -m pytest tests/ -q
        working-directory: backend
        env:
          LLM_API_KEY: test-key
          NEO4J_PASSWORD: test-password
          SECRET_KEY: test-secret-key-for-ci-only
          # Opts the graph-store integration tests in against the service above.
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_PASSWORD: test-password

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # No frontend test runner is configured yet, so the build is the gate:
      # it catches syntax errors and unresolved imports in the Vue sources.
      - name: Build
        run: npm run build
        working-directory: frontend

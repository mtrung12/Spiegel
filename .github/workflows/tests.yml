name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run redundant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11
        working-directory: backend

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # Config.validate() runs at import in wsgi.py, and several tests build the
      # app via create_app(). Supply placeholder credentials so collection does
      # not depend on a real .env: the suite stubs out every outbound call.
      - name: Run tests
        run: uv run python -m pytest tests/ -q
        working-directory: backend
        env:
          LLM_API_KEY: test-key
          ZEP_API_KEY: test-key
          SECRET_KEY: test-secret-key-for-ci-only

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # No frontend test runner is configured yet, so the build is the gate:
      # it catches syntax errors and unresolved imports in the Vue sources.
      - name: Build
        run: npm run build
        working-directory: frontend

# Serves the built frontend and proxies the API to gunicorn.
#
# Because both are served from the same origin here, browser requests to /api
# are not cross-origin and CORS does not come into play in this deployment.
#
# Included from the main nginx.conf's http{} block, so only server-level and
# location-level directives belong here. Writable paths for the unprivileged
# user are set in the Dockerfile.

server {
    # Port 3000 is above 1024, so binding it does not require root.
    listen 3000;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # Uploads are capped at 50MB by Flask's MAX_CONTENT_LENGTH; keep nginx
    # from rejecting a large brief before the app can report the limit itself.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Graph builds, simulation prepare and report generation are long
        # LLM-bound requests; the 60s default cuts them off mid-flight.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # The log-streaming endpoints emit incrementally.
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:5001/health;
    }

    # SPA routing: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

[project]
name = "spiegel-backend"
version = "0.1.0"
description = "Spiegel - simulates how an audience reacts to a marketing campaign"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Spiegel Team" }
]

dependencies = [
    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM
    "openai>=1.0.0",
    
    # Vector index over the simulated audience's posts and comments
    "qdrant-client>=1.9.0",

    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # OASIS social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supports non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # WSGI server, used by docker/entrypoint.sh in the container image.
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]
# The `threads` corpus source renders threads.net in a headless browser, since
# there is no public search API. Chromium is a further ~300 MB and pip does not
# install it: run `playwright install chromium` afterwards. Without these the
# source reports itself unavailable and is skipped.
threads = [
    "playwright>=1.44.0",
    "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
